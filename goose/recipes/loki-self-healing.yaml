version: 1.0.0
title: Loki Self-Healing
description: Audita e corrige artefatos internos do pacote Loki no working tree a partir de um arquivo, diretório, workflow ou staged files, lendo o contexto global do pacote, classificando install scopes, aplicando apenas correções claras e escopadas, rodando validadores proporcionais e nunca alterando o índice git.
instructions: |
  Você executa a recipe “Loki Self-Healing” para manutenção interna do Loki Framework.

  Objetivo:
  - Auditar artefatos internos do pacote Loki contra os padrões do próprio pacote.
  - Aplicar correções diretamente no working tree quando forem claras, verificáveis, dentro do escopo e de baixo risco.
  - Nunca fazer stage, commit, reset, checkout nem alterar o índice git.
  - Encerrar com relatório revisável para o usuário revisar diff e stagear manualmente.

  Classificação operacional:
  - Workflow híbrido de auditoria, correção serializada e orquestração opcional por handoffs read-only.
  - Use modelo de raciocínio forte/frontier para escopos amplos, conflitos de pacote, mudanças em command bundles/skills/agents/templates/docs/scripts/manifest ou divergência entre staged e working tree.

  Separação de responsabilidades:
  - Trate esta Goose Recipe como o Command/orquestrador: ela coordena Input, Execution e Response.
  - Trate skills como conhecimento especializado reutilizável; não transforme `loki-self-healing` ou helper skills em mini-orquestradores.
  - Prefira agentes de escrita especializados quando já existirem e o escopo aprovado for compatível.
  - Como ainda não há Write Agent Goose-native especializado para self-healing geral do pacote, a recipe pode aplicar correções diretamente na thread principal como exceção controlada.
  - Quando a recipe escrever diretamente por ausência de Write Agent adequado, registre no relatório final uma oportunidade de melhoria para criar agente especializado se o padrão de escrita se repetir.
  - Handoffs read-only nunca escrevem; retornam achados/propostas para a thread principal.
  - Para catalogação documental em `/docs`, se houver handoff aprovado e escopo documental suficiente, o agente `catalogador` existente pode ser usado como Write Agent pós-approval; ele não deve ser tratado como proposal-only.

  Fases do command/recipe:
  - Input: coletar `scope_input`, `loki_root`, exclusões, decisão sobre validadores e permissão para arquivos obrigatórios de consistência; perguntar apenas dados obrigatórios ausentes.
  - Execution: resolver escopo, ler fontes, montar source map, auditar, classificar achados, delegar quando seguro, aplicar correções serialmente e rodar validadores.
  - Response: responder em Markdown para humano, com relatório acionável e conciso; quando outro LLM for consumidor explícito, incluir handoff estruturado em bloco separado.

  1. Resolver entrada e package root
  - Receba `scope_input` como arquivo, diretório, workflow Loki ou `staged`.
  - Se `loki_root` for `auto`, vazio ou ausente, infira subindo a partir do escopo até encontrar `manifest.yaml`, `skills/`, `agents/` e `docs/`.
  - Se não conseguir inferir com segurança, pergunte pelo `loki_root`.
  - Se não houver escopo e não houver staged files, pare e peça escopo.
  - Se o escopo apontar para fora do package root, pare.

  2. Resolver escopo
  - Para arquivo: selecione o arquivo e metadados obrigatórios relacionados.
  - Para diretório: enumere arquivos do pacote sob o diretório.
  - Para workflow: mapeie o command bundle, helper skills, referências, assets, templates, docs, manifest, inventário, router e instalador relacionados.
  - Para `staged`: use `git diff --cached --name-only --diff-filter=ACMR` somente para selecionar arquivos; aplique correções apenas aos arquivos no working tree.
  - Aplique `scope_exclusions` se fornecido.

  3. Ler contexto global antes de escrever
  Leia, no mínimo quando existirem e forem relevantes:
  - `install-scopes.json`;
  - `docs/operational-inventory.md`;
  - `manifest.yaml`;
  - `docs/package-authoring-guardrails.md`;
  - `docs/model-effort-guidance.md` quando o escopo envolver model, effort, execution_profile ou adapter_projection;
  - comandos, skills, referências, templates, docs, scripts, agents e instalador relacionados ao escopo.

  4. Classificar install scope
  - Antes de qualquer escrita em command bundles ou `skills/**`, leia `install-scopes.json`.
  - Classifique cada comando/skill selecionado como `internal-only`, `both`, `consumer-only` ou `unclassified-blocker`.
  - Não edite arquivo `unclassified-blocker`; registre como bloqueado.
  - Para artefatos `both`, aplique checklist de neutralidade antes de qualquer correção.

  5. Montar source map
  Registre:
  - escopo resolvido;
  - arquivos candidatos;
  - install scope de comandos/skills;
  - fontes globais lidas;
  - relações esperadas com manifest, inventário, docs, instalador e referências;
  - validators aplicáveis;
  - forbidden writes.

  6. Analisar arquivos
  - Analise arquivos individualmente contra clareza, contrato, metadata, referências, sincronização, limites de autonomia, gates, validators, forbidden writes, neutralidade de `both`, redundância, conflitos e output actionability.
  - Use handoffs read-only por arquivo ou grupo independente somente quando o runtime permitir.
  - Handoffs retornam achados e proposta; não escrevem.
  - Se não houver paralelismo seguro, mantenha subseções independentes por arquivo na thread principal.

  7. Classificar achados
  Classifique cada achado como:
  - `corrigir agora`: claro, escopado, verificável, coerente com regras do pacote e baixo risco;
  - `nao alterar`: já coberto ou mudança adicionaria ruído;
  - `investigar`: promissor mas evidência insuficiente ou escopo amplo demais;
  - `fora de escopo`: fora do escopo e não obrigatório para consistência;
  - `bloqueado`: requer decisão humana, pesquisa externa ou forbidden write.

  Aplique somente `corrigir agora`.

  8. Aplicar correções
  - Consolide achados antes de escrever.
  - Escreva serialmente usando o menor patch coerente.
  - Não permita dois handoffs/subtarefas escreverem o mesmo arquivo em paralelo.
  - Preserve estilo do pacote.
  - Não amplie silenciosamente o escopo, exceto arquivos de consistência obrigatória quando `allow_required_consistency_files` for verdadeiro.

  Allowed writes:
  - dentro do package root e do escopo explícito: `skills/**`, `agents/**`, `codex/agents/**`, `templates/**`, `docs/**`, `README.md`, `index.md`, `manifest.yaml`, `scripts/**`;
  - arquivos obrigatórios de consistência do pacote, como manifest, inventário, command workflow skill ou instalador, quando a correção exigir.

  Forbidden writes:
  - `git add`, `git commit`, `git reset`, `git checkout` ou qualquer alteração no índice git;
  - `.claude/**`, `.codex/**`, `.agents/**` como destinos instalados ou espelhos locais;
  - arquivos fora do package root;
  - runtime, engine, framework ou projeto consumidor;
  - mudanças fora do escopo sem necessidade de consistência.

  9. Rodar validadores
  Se `run_validators` for verdadeiro, rode validadores proporcionais ao escopo:
  - `find skills -maxdepth 2 -name SKILL.md | sort`;
  - `find skills -maxdepth 1 -type f -name '*.md'`;
  - validação de frontmatter de skills quando skills forem tocadas;
  - validação de paths do `manifest.yaml` quando manifest/inventário forem tocados;
  - `python3 scripts/validate-install-scopes.py` quando tocar command bundles, skills ou superfícies instaláveis;
  - `python3 scripts/install-loki-symlinks.py --dest /tmp/loki-symlink-test --dry-run --profile package-source` quando tocar bundles/skills, agents, templates, scripts ou instalador;
  - validadores específicos do artefato corrigido.

  10. Stop conditions
  Pare e peça decisão humana quando:
  - o escopo não puder ser resolvido;
  - o escopo sair do package root;
  - a única correção possível exigir forbidden write;
  - a correção depender de informação externa atual, web research ou decisão de produto ausente;
  - houver conflito interno sem critério claro;
  - uma edição em command bundle ou `skills/**` depender de install scope ausente.

  11. Relatório final
  Responda em Markdown com:
  - escopo resolvido;
  - fontes lidas;
  - arquivos analisados;
  - install scopes;
  - achados por classificação;
  - correções aplicadas;
  - arquivos alterados;
  - validadores executados e resultados;
  - falhas ou validadores não executados com motivo;
  - itens não alterados;
  - riscos residuais;
  - próximo passo do usuário: revisar diff e stagear manualmente o que quiser manter.
prompt: |
  Execute Loki Self-Healing com estes parâmetros:

  - Escopo: {{ scope_input }}
  - Loki root: {{ loki_root }}
  - Exclusões/fora de escopo: {{ scope_exclusions }}
  - Rodar validadores: {{ run_validators }}
  - Permitir arquivos obrigatórios de consistência: {{ allow_required_consistency_files }}

  Aplique correções claras e escopadas no working tree, não altere o índice git, não escreva em `.claude/**`, `.codex/**` ou `.agents/**`, e finalize com relatório Markdown para revisão humana.
extensions:
- type: platform
  name: developer
  description: Write and edit files, and execute shell commands
  display_name: Developer
  bundled: true
- type: platform
  name: summon
  description: Load knowledge and delegate tasks to subagents
  display_name: Summon
  bundled: true
activities:
- "Self-heal staged files"
- "Self-heal a Loki file"
- "Self-heal a Loki directory"
- "Self-heal a Loki workflow"
parameters:
- key: scope_input
  input_type: string
  requirement: required
  description: Arquivo, diretório, workflow Loki ou staged.
- key: loki_root
  input_type: string
  requirement: optional
  description: Raiz do Loki Framework. Use auto para inferir.
  default: auto
- key: scope_exclusions
  input_type: string
  requirement: optional
  description: Lista textual de exclusões ou fora de escopo fornecida pelo usuário.
  default: ""
- key: run_validators
  input_type: boolean
  requirement: optional
  description: Se verdadeiro, roda validadores proporcionais ao escopo.
  default: "true"
- key: allow_required_consistency_files
  input_type: boolean
  requirement: optional
  description: Permite tocar arquivos obrigatórios de consistência do pacote, mesmo fora do escopo direto, quando necessário.
  default: "true"
