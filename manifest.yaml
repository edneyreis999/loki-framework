layout:
  agents: "agents/"
  codex_agents: "codex/agents/"
  skills: "skills/"
  scripts: "scripts/"
  templates: "templates/"
  docs: "docs/"
  install_scope_source: "install-scopes.json"

artifact_identity_policy:
  precedence: "Operational identity overrides storage directory, extension and adapter serialization."
  command_bundle:
    path: "skills/loki-<stem>/SKILL.md"
    type: command
    serialization: skill-bundle
  operational_skills:
    namespaces:
      - "lf-*"
      - "<domain-or-technology>-*"

scripts:
  - name: "install-loki-symlinks"
    file: "scripts/install-loki-symlinks.py"
    status: draft
    purpose: "Install Loki command bundles, skills, agents, templates and Codex agents by symlink after approval, filtered by install profile."
  - name: "validate-install-scopes"
    file: "scripts/validate-install-scopes.py"
    status: draft
    purpose: "Validate installer scope metadata, command-bundle identity, shared-artifact neutrality, bundle command dependencies, Codex agent TOML and agent project tags."
  - name: "validate-install-loki-upgrade"
    file: "scripts/validate-install-loki-upgrade.py"
    status: draft
    purpose: "Validate clean installer profile baselines and reject non-schema-v2 layouts in temporary fixtures without touching consumer destinations."
  - name: "validate-implement-feature-contracts"
    file: "scripts/validate-implement-feature-contracts.py"
    status: draft
    purpose: "Validate canonical_execution_state v1, real typed operations, atomic CAS/replay behavior, pure views, resume order, optional artifacts and the current-only cutover."
  - name: "validate-manual-qa-contracts"
    file: "scripts/validate-manual-qa-contracts.py"
    status: draft
    purpose: "Validate state-only Manual QA eligibility, ephemeral checklist rendering, closed feedback payloads, zero-write routes and real approve_manual_qa behavior against the canonical state helper."
  - name: "validate-llm-artifact-precheck"
    file: "scripts/validate-llm-artifact-precheck.py"
    status: draft
    purpose: "Validate package materiality/profile packets mechanically before independent LLM artifact audit; never emit quality approval."
  - name: "validate-execution-knowledge"
    file: "scripts/validate-execution-knowledge.py"
    status: draft
    purpose: "Validate provider-neutral execution-knowledge schema-v1 entries, lineage, materiality, capture states, exclusive targets, sanitization and unpromoted status."
  - name: "validate-loki-init-catalogador-contracts"
    file: "scripts/validate-loki-init-catalogador-contracts.py"
    status: draft
    purpose: "Validate schema-v1 init packets and publication batches, catalogador caller/mode and ownership rules, fixtures, and current-tree agent projections."

install_scope_sources:
  - name: "install-scopes"
    file: "install-scopes.json"
    status: draft
    purpose: "Machine-readable source for installer artifact scopes and profiles."

