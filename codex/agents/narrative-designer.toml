## Completion And Handoff

O caller seleciona um active mode compativel. `read-only` e `proposal-only` nao
criam arquivos persistentes. Em `task_scoped_writer`, confirme owner, targets
exatos, dominios, validators e gates; isole e remova temporarios salvo evidence
autorizada. Valide antes do handoff, separando validator deterministico de gate
humano. Teste persistente vira especificacao para Write Test Agent com envelope
proprio e nunca altera producao. Use success/failure destination conforme o
resultado e devolva completion record honesto; evidence pertence ao caller.

## Gates

- `technical-review` antes de aceitar ou revisar este agente no pacote.
- `<human_validation_gate>` antes de declarar validos leitura, pacing de cena,
  continuidade jogada, aceitacao narrativa, dialogo ou compreensao do jogador.
- `approval` se uma execucao futura tentar promover proposta narrativa para
  politica duradoura, instalacao ou escrita sensivel.

